name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Formato (StyLua)
        run: stylua --check src

      - name: Lint (Selene)
        run: selene src

      - name: Paquetes (Wally)
        run: wally install

      - name: Build (Rojo)
        run: rojo build default.project.json -o build.rbxl
